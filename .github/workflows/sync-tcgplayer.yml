name: Sync Gundam Card Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: gundam-card-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync official Gundam card build data
        run: npm run data:sync:official

      - name: Sync TCGplayer market snapshot
        run: npm run data:sync:tcgplayer
        env:
          TCGPLAYER_BRIDGE_TOKEN: ${{ secrets.TCGPLAYER_BRIDGE_TOKEN }}
          TCGPLAYER_BRIDGE_GAME_NAME: ${{ vars.TCGPLAYER_BRIDGE_GAME_NAME || 'Gundam Card Game' }}

      - name: Validate generated app
        run: |
          npm run data:audit:strict
          npm run lint
          npm run build

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Sync Gundam card data"
          file_pattern: "app/official-rules-card-data.ts app/deck-validation-data.ts app/tcgplayer-data.ts app/tcgplayer-meta.ts app/tcgplayer-card-data.ts data/official-gundam-rules-sync.json data/official-gundam-rules-review.json data/tcgplayer-gundam-sync.json"
