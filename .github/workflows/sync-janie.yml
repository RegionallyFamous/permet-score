name: Sync Janie Gundam Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Janie market snapshot
        run: npm run data:sync:janie
        env:
          JANIE_API_ORIGIN: ${{ vars.JANIE_API_ORIGIN || 'https://janie.up.railway.app' }}
          JANIE_API_TOKEN: ${{ secrets.JANIE_API_TOKEN }}
          JANIE_GUNDAM_GAME_NAME: ${{ vars.JANIE_GUNDAM_GAME_NAME || 'Gundam Card Game' }}

      - name: Validate generated app
        run: |
          npm run data:audit:strict
          npm run lint
          npm run build

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Sync Janie Gundam card data"
          file_pattern: "app/tcgplayer-data.ts app/tcgplayer-card-data.ts data/janie-gundam-sync.json"
